name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WHATSAPP_VERIFY_TOKEN: test
      WHATSAPP_PHONE_NUMBER_ID: test
      WHATSAPP_ACCESS_TOKEN: test
      WHATSAPP_APP_SECRET: test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Prisma tooling
        run: npm ci

      - name: Install backend
        run: npm --prefix backend ci

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

      - name: Validate operational scripts
        run: bash -n scripts/backup-database.sh scripts/restore-database-drill.sh scripts/install-backup-service.sh scripts/deploy.sh scripts/prisma-vps.sh scripts/vps-preflight.sh

      - name: Generate Prisma clients
        run: |
          npx prisma generate
          cd backend && npx prisma generate --schema ../prisma/schema.prisma

      - name: Run tests
        run: npm --prefix backend test

      - name: Verify operational cash query contract
        run: node --test scripts/operational-cash-query.test.cjs

  inbound-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INBOUND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inbound_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inbound_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Generate Prisma clients
        run: |
          npx prisma generate
          cd backend && npx prisma generate --schema ../prisma/schema.prisma
      - name: Verify fresh database migrations match Prisma schema
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm --prefix backend run test:postgres

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: cd frontend && npm ci

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Verify POS and dashboard helpers
        run: |
          mapfile -t helper_tests < <(find scripts -maxdepth 1 -name '*.test.cjs' ! -name '*-postgres.test.cjs' ! -name 'operational-cash-query.test.cjs' | sort)
          node --test "${helper_tests[@]}"

      - name: Build frontend
        run: npm --prefix frontend run build

  administration-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mateos_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mateos_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/mateos_dev
      OPENAI_API_KEY: test
      WHATSAPP_VERIFY_TOKEN: test
      WHATSAPP_PHONE_NUMBER_ID: test
      WHATSAPP_ACCESS_TOKEN: test
      WHATSAPP_APP_SECRET: test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install test dependencies
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix frontend ci
      - name: Generate Prisma clients and apply migrations
        run: |
          npx prisma generate
          (cd backend && npx prisma generate --schema ../prisma/schema.prisma)
          npx prisma migrate deploy
      - name: Verify administration against isolated PostgreSQL
        run: |
          node backend/src/scripts/seed-event-types.js
          node --test scripts/*-postgres.test.cjs
