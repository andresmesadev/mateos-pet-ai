name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      WHATSAPP_VERIFY_TOKEN: test
      WHATSAPP_PHONE_NUMBER_ID: test
      WHATSAPP_ACCESS_TOKEN: test
      WHATSAPP_APP_SECRET: test
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Prisma tooling
        run: npm ci

      - name: Install backend
        run: npm --prefix backend ci

      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm --prefix backend audit --omit=dev --audit-level=high

      - name: Generate Prisma clients
        run: |
          npx prisma generate
          cd backend && npx prisma generate --schema ../prisma/schema.prisma

      - name: Run tests
        run: npm --prefix backend test

  inbound-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: inbound_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inbound_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INBOUND_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inbound_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inbound_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - run: npm ci
      - run: npm --prefix backend ci
      - name: Generate Prisma clients
        run: |
          npx prisma generate
          cd backend && npx prisma generate --schema ../prisma/schema.prisma
      - run: npm --prefix backend run test:postgres

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: cd frontend && npm ci

      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high

      - name: Lint frontend
        run: cd frontend && npm run lint
