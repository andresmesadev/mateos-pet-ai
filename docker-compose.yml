services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://bot.nexoweb.co
    ports:
      - "3001:3001"
    env_file:
      - ./frontend/.env.local
    environment:
      PORT: "3001"
      API_URL: http://backend:3000
      NEXT_PUBLIC_API_URL: https://bot.nexoweb.co
    depends_on:
      - backend
    restart: unless-stopped
